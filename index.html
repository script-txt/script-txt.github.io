title: Index
nav_order: 1
---

<ul style="list-style:none; margin:0; padding:0">
  {% for post in site.posts | sort: "date" | reverse %}
    <li>
      <h2 id="{{ post.title | slugify }}" style="border-bottom:none"><a href="{{ post.url }}">{{ post.title }}</a></h2>
      {{ post.date | date: "%Y %m %d"}} {{ post.excerpt }}
    </li>
  {% endfor %}
</ul>
