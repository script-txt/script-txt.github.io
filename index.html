title: Index
nav_order: 1
---
{% assign sorted_posts = site.posts | sort: "date" | reverse %}
<ul class="post-list">
  {%- for post in sorted_posts %}
  <li>
    <a class="post-title" href="{{ post.url | relative_url }}">{{ post.title }}
    <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%Y %m %d" }}</time>
    {{ post.excerpt }} (...)</a>
  </li>
  {%- endfor %}
</ul>
