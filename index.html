---
title: Index
nav_order: 1
---

<ul>
  {% for post in site.posts | sort: "date" | reverse %}
    <li>
      <h2 id="{{ post.title | slugify }}">{{ post.title }}</h2>
      <a href="{{ post.url }}">{{ post.title }}</a>
      {{ post.date | date: "%Y %m %d"}} {{ post.excerpt }}
    </li>
  {% endfor %}
</ul>
