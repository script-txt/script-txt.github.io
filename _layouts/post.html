---
layout: default
---
<div class="meta">
  <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y %m %d" }}</time>
  {%- for category in page.categories %}
  <span class="bubble category">{{ category | escape }}</span>
  {%- endfor %}
  {%- for tag in page.tags %}
  <a class="bubble" href="{{ '/tags/' | relative_url }}#{{ tag | slugify }}">{{ tag | escape }}</a>
  {%- endfor %}
</div>
{{ content }}
